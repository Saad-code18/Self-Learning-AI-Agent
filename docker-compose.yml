# =============================================================================
#  docker-compose.yml - the self-hosted memory stack
#
#  Everyday use (Qdrant only, run the Python code on your machine):
#      docker compose up -d
#
#  Run the agent's HTTP API inside Docker too:
#      docker compose --profile app up --build
#
#  Fully local LLM with Ollama inside Docker (no API key at all):
#      docker compose --profile local up -d
#      docker compose exec ollama ollama pull llama3.1:8b
#      docker compose exec ollama ollama pull nomic-embed-text
#
#  Stop everything (memories are kept in the volumes):   docker compose down
#  Stop AND delete all memories:                          docker compose down -v
# =============================================================================
services:

  # ---- Qdrant: the vector database where memories live -----------------------
  qdrant:
    image: qdrant/qdrant:v1.19.1        # pinned version = reproducible setup
    container_name: memory-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                     # REST API (used by the app) + web UI at http://localhost:6333/dashboard
      - "6334:6334"                     # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage  # persists memories across restarts
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      # The image has no curl; opening the TCP port with bash is enough to know it is up.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ---- The agent as an HTTP API (optional, profile "app") --------------------
  app:
    build: .
    container_name: memory-agent-app
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false               # works even before you created .env (then defaults apply)
    environment:
      QDRANT_HOST: qdrant             # inside the compose network Qdrant is reachable by its service name
      QDRANT_PORT: 6333
      HISTORY_DB_PATH: /data/mem0_history.db
      # Ollama on your HOST machine is reachable from the container via host.docker.internal.
      # If you use the "local" profile below, set OLLAMA_BASE_URL_DOCKER=http://ollama:11434 in .env instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes host.docker.internal work on Linux too
    ports:
      - "8000:8000"                   # API + Swagger docs at http://localhost:8000/docs
    volumes:
      - app_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  # ---- Ollama: local LLM + embeddings (optional, profile "local") -------------
  ollama:
    image: ollama/ollama:latest
    container_name: memory-agent-ollama
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama   # downloaded models are kept here

volumes:
  qdrant_storage:
  app_data:
  ollama_models:
